<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <!-- Concentric 90-degree arcs (Center: 96, 172) -->
    <!-- Radii: 105.0, 74.0, 43.0 (Uniform ~31px pitch = ~15px gap between all tiers) -->
    <path id="outer-arc" d="M 21.75 97.75 A 105 105 0 0 1 170.25 97.75" />
    <path id="mid-arc" d="M 43.67 119.67 A 74 74 0 0 1 148.33 119.67" />
    <path id="inner-arc" d="M 65.59 141.59 A 43 43 0 0 1 126.41 141.59" />
  </defs>

  <!-- 1. Black Outline Pass (Stroke: 22px) -->
  <g fill="none" stroke="#000000" stroke-width="22" stroke-linecap="round">
    <use href="#outer-arc" />
    <use href="#mid-arc" />
    <use href="#inner-arc" />
  </g>
  <circle cx="96" cy="172" r="16" fill="#000000" />

  <!-- 2. Blue Fill Pass (Stroke: 16px) -->
  <g fill="none" stroke="#3235FF" stroke-width="16" stroke-linecap="round">
    <use href="#outer-arc" />
    <use href="#mid-arc" />
    <use href="#inner-arc" />
  </g>
  <circle cx="96" cy="172" r="13" fill="#3235FF" />
</svg>